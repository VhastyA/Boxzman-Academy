services:
  - type: web
    name: forma-architecture-academy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: forma-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: FORMA_ADMIN_PASSWORD
        sync: false
